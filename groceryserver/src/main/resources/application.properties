spring.application.name=groceryserver
spring.config.import=optional:file:./.env[.properties],optional:file:./groceryserver/.env[.properties]
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:groceryapp}
spring.data.mongodb.auto-index-creation=true
app.seller.email=${APP_SELLER_EMAIL:admin@groceryapp.com}
app.seller.password=${APP_SELLER_PASSWORD}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
